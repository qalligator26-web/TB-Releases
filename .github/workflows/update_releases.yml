name: Update PS Releases JSON

on:
  schedule:
    - cron: '0 2 * * *' # ദിവസവും രാവിലെ 7:30 IST-ന് ഓട്ടോമാറ്റിക്കായി റൺ ആകും
  workflow_dispatch:    # നമുക്ക് എപ്പോൾ വേണമെങ്കിലും മാനുവലായി റൺ ചെയ്യാം

jobs:
  sync-igdb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch IGDB releases
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python fetch_releases.py

      - name: Commit and push updated releases.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update PS releases"
          git push
